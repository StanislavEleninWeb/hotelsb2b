packages:
  - "apps/*"
  - "packages/*"

# Native/postinstall build scripts we explicitly trust:
#   esbuild        — backs tsup (packages/shared dual build)
#   sharp          — Next.js image optimization
#   unrs-resolver  — ESLint import resolver native binding
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: true
  unrs-resolver: true

# Force a single @types/react across the monorepo. Web/staff use React 19 and
# React Native 0.76 pulls @types/react 18 transitively — two copies make
# @tanstack/react-query's ReactNode incompatible with the apps' own. Pin to 19.
overrides:
  '@types/react': 19.2.18

# Dependency-audit triage (Phase 10 CI gate). These high/critical advisories are
# all TRANSITIVE through frameworks/build tooling with no direct fix available:
# expo/@expo/cli (mobile build toolchain — not shipped in server containers),
# @nestjs/cli + prisma CLI (devDependencies — not in the runtime image), and sharp
# via Next (resolves on Next bumps). Tracked by Dependabot; re-reviewed each bump.
# The `pnpm audit --audit-level high` CI gate still fails on any NEW advisory.
auditConfig:
  ignoreGhsas:
    - GHSA-34x7-hfp2-rc4v
    - GHSA-8qq5-rm4j-mr97
    - GHSA-83g3-92jg-28cx
