name: Deploy staging

# On merge to main: build the exact artifact, push to ECR tagged with the commit
# sha, then roll the staging ECS services and wait for them to stabilize.
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }} # e.g. <acct>.dkr.ecr.<region>.amazonaws.com
  ECS_CLUSTER: hotel-staging-cluster

jobs:
  build-push:
    name: Build & push images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web, staff]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build & push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: . # repo root — the Dockerfiles expect it
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/hotel-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: DB migrate (staging)
    runs-on: ubuntu-latest
    needs: build-push
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { version: 11.22.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm --filter @hotel/api exec prisma migrate deploy

  deploy:
    name: Roll ECS services
    runs-on: ubuntu-latest
    needs: migrate
    environment: staging
    strategy:
      matrix:
        app: [api, web, staff]
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # The task definition pins the sha-tagged image; force a new deployment and
      # block until the service reports stable (fails the workflow on rollback).
      - name: Force new deployment
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "hotel-staging-${{ matrix.app }}" \
            --force-new-deployment
      - name: Wait for stable
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "hotel-staging-${{ matrix.app }}"
